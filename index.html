<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>D-Day Experience — Web Prototype</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; overflow:hidden; background:#111; color:#ddd; font-family:system-ui,Arial }
    #overlay { position: absolute; left:10px; top:10px; z-index:20; background:rgba(0,0,0,0.35); padding:8px; border-radius:6px; }
    #canvas-wrap { width:100%; height:100%; }
    a { color:#7fc1ff }
    .hint { opacity:0.8; font-size:13px }
  </style>
</head>
<body>
  <div id="overlay">
    <strong>D-Day Web Prototype</strong><br>
    <span class="hint">WASD to move • Mouse to look • Left click to fire • R to reload • T to toggle third/first person</span><br>
    <small>No sounds included. Built with Three.js</small>
  </div>

  <div id="canvas-wrap"></div>

  <!-- Three.js and helpers -->
  <script src="https://unpkg.com/three@0.150.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.150.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://unpkg.com/three@0.150.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Project scripts -->
  <script src="src/terrain.js"></script>
  <script src="src/water.js"></script>
  <script src="src/fx.js"></script>
  <script src="src/animsystem.js"></script>
  <script src="src/input.js"></script>
  <script src="src/player.js"></script>
  <script src="src/npc.js"></script>
  <script src="src/boat.js"></script>
  <script src="src/bunker.js"></script>
  <script src="src/gamemanager.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
